# Имя вашего workflow, которое будет отображаться в интерфейсе GitHub Actions
name: UI tests

# Указываем, когда будет запускаться данный workflow
on:
  push:
    branches:
      - main  # Запускать workflow, когда будет сделан коммит в ветку main
  pull_request:
    branches:
      - main  # Запускать workflow, когда будет сделан pull request в ветку main

# Определяем все шаги, которые должны быть выполнены в рамках работы с тестами
jobs:
  run-tests:
    runs-on: ubuntu-latest  # Указываем, что тесты будут запускаться на последней версии Ubuntu

    steps:
      # 1. Шаг, который будет клонировать ваш репозиторий на машину GitHub Actions
      - name: Check out repository
        uses: actions/checkout@v7  # Используем GitHub Action для клонирования репозитория

      # 2. Шаг для установки Python на виртуальной машине
      - name: Set up Python
        uses: actions/setup-python@v6  # Используем GitHub Action для установки Python
        with:
          python-version: '3.13'  # Устанавливаем версию Python 3.13 (можно заменить на другую версию)

      # 3. Шаг для установки всех зависимостей проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  # Обновляем pip до последней версии
          pip install -r requirements.txt  # Устанавливаем зависимости, указанные в requirements.txt
          playwright install --with-deps  # Устанавливаем браузеры для Playwright (если они не установлены)

      # 4. Шаг для запуска тестов с использованием pytest и генерации отчётов Allure
      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2  # Запускаем тесты, отмеченные как "regression", генерируем результаты для Allure

      # 5. Шаг для получения истории отчётов Allure, если она существует
      - name: Get Allure history
        uses: actions/checkout@v7
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history

      # 6. Установка Allure CLI и генерация отчёта
      - name: Install Allure CLI
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.32.2/allure-2.32.2.tgz
          tar -xzf allure-2.32.2.tgz
          echo "$(pwd)/allure-2.32.2/bin" >> $GITHUB_PATH

      - name: Create executor.json for Allure
        if: always()
        run: |
          cat > allure-results/executor.json << 'EOF'
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": ${{ github.run_number }},
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "UI Tests Report",
            "reportUrl": "https://f4nin.github.io/autotests-ui/${{ github.run_number }}/"
          }
          EOF

      - name: Copy history from previous runs
        if: always()
        continue-on-error: true
        run: |
          if [ -d "gh-pages-history/history" ]; then
            cp -r gh-pages-history/history allure-results/
            echo "History copied"
          else
            echo "No history found (first run)"
          fi

      - name: Generate Allure report into numbered folder
        if: always()
        run: |
          RUN_DIR="deploy/${{ github.run_number }}"
          allure generate allure-results --clean --output "$RUN_DIR"
          if [ -d "$RUN_DIR/history" ]; then
            mkdir -p deploy/history
            cp -r "$RUN_DIR/history"/* deploy/history/
          fi
          echo "=== Report generated: $RUN_DIR ==="
          ls -la "$RUN_DIR"
          echo "=== index.html exists: $([ -f $RUN_DIR/index.html ] && echo YES || echo NO) ==="

      # 7. Шаг для деплоя отчёта Allure на GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: deploy
          keep_files: true
