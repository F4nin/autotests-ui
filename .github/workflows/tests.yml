name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results


  publish-report:
    if: always()
    needs: [ run-tests ]
    runs-on: ubuntu-latest

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Debug: show allure-results content
        if: always()
        run: |
          echo "=== Files in allure-results ==="
          ls -la allure-results/ || echo "Directory is empty or missing"
          echo "=== File count ==="
          find allure-results -type f | wc -l

      - name: Install Allure CLI
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.32.2/allure-2.32.2.tgz
          tar -xzf allure-2.32.2.tgz
          echo "$(pwd)/allure-2.32.2/bin" >> $GITHUB_PATH

      - name: Checkout gh-pages for history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: allure-report

      - name: Copy history into allure-results
        if: always()
        continue-on-error: true
        run: |
          if [ -d "allure-report/history" ]; then
            cp -r allure-report/history allure-results/
            echo "History copied"
          else
            echo "No history found, first run"
          fi

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results --clean --output allure-report

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report